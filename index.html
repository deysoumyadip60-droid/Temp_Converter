<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="converter-box">
            <h1>🌡️ Temperature Converter</h1>
            
            <!-- Input Section -->
            <div class="input-section">
                <label>Enter Temperature Value:</label>
                <input type="number" id="tempInput" placeholder="Enter value" step="0.01">
                <span class="error-message" id="errorMsg"></span>
            </div>

            <!-- Unit Selector -->
            <div class="unit-selector">
                <label>Select Input Unit:</label>
                <div class="radio-group">
                    <label><input type="radio" name="inputUnit" value="celsius" checked> Celsius (°C)</label>
                    <label><input type="radio" name="inputUnit" value="fahrenheit"> Fahrenheit (°F)</label>
                    <label><input type="radio" name="inputUnit" value="kelvin"> Kelvin (K)</label>
                </div>
            </div>

            <!-- Convert Button -->
            <button id="convertBtn" class="convert-btn">Convert</button>

            <!-- Results Section -->
            <div class="results-section">
                <h3>Results:</h3>
                <div class="result-box">
                    <div class="result-item">
                        <span>Celsius (°C):</span>
                        <span id="celsiusResult">-</span>
                    </div>
                    <div class="result-item">
                        <span>Fahrenheit (°F):</span>
                        <span id="fahrenheitResult">-</span>
                    </div>
                    <div class="result-item">
                        <span>Kelvin (K):</span>
                        <span id="kelvinResult">-</span>
                    </div>
                </div>
            </div>

            <!-- Information Box -->
            <div class="info-box">
                <p>💡 <strong>Note:</strong> Absolute zero is -273.15°C or 0K. Values below this are not physically possible.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
